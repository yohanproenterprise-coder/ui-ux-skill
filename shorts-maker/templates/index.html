<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Shorts Maker</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--fg:#f2f3f5;--mut:#9aa0ab;--acc:#ff3b5c}
@media(prefers-color-scheme:light){:root{--bg:#f5f6f8;--card:#fff;--fg:#14161a;--mut:#667}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
main{max-width:960px;margin:auto;padding:24px 16px}h1{margin:0 0 4px}p.s{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:16px}
input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #8884;background:transparent;color:inherit}
#url{width:100%;margin-bottom:12px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
button{background:var(--acc);border:0;color:#fff;font-weight:600;cursor:pointer}button:disabled{opacity:.5}
#st{color:var(--mut);margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
video{width:100%;aspect-ratio:9/16;background:#000;border-radius:10px}small{color:var(--mut)}.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.mini{padding:6px 10px;font-size:13px;background:#8883;color:inherit}a{color:var(--acc)}
</style></head><body><main>
<h1>Shorts Maker</h1><p class="s">Colle une URL YouTube → clips verticaux 9:16 prêts pour Shorts / TikTok / Reels.</p>
<div class="card"><input id="url" placeholder="https://www.youtube.com/watch?v=…">
<div class="row">
<label>Clips <select id="n"><option>3</option><option selected>5</option><option>8</option></select></label>
<label>Durée <select id="len"><option>20</option><option selected>35</option><option>55</option></select> s</label>
<label>Format <select id="mode"><option value="blur">Fond flouté</option><option value="crop">Recadrage centré</option></select></label>
<label><input type="checkbox" id="cap" checked style="width:auto"> Sous-titres</label>
<label><input type="checkbox" id="hook" checked style="width:auto"> Accroche à l'écran</label>
<label>Texte du post <select id="post"><option value="satisfying">Satisfying (EN)</option><option value="">Auto (Claude / titre)</option></select></label>
<button id="go">Générer</button></div><div id="st"></div></div>
<div class="grid" id="out"></div></main>
<h2 id="ph" hidden>Mes projets précédents</h2><div id="old"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const copyTxt=(b,t)=>{navigator.clipboard.writeText(t);b.textContent='Copié ✓'};
window.copies=[];
const card=m=>{
  const base=[m.title,m.description,(m.hashtags||[]).join(' ')].filter(Boolean).join('\n\n');
  const btn=(label,txt)=>{window.copies.push(txt);const i=window.copies.length-1;
    return `<button class="mini" onclick="copyTxt(this,window.copies[${i}])">${label}</button>`};
  const p=m.post;
  const buttons=p?btn('Copier TikTok',p.tiktok)+btn('Copier YouTube (titre)',p.youtube_title)+btn('Copier YouTube (desc.)',p.youtube_desc):btn('Copier le texte',base);
  return `<div class="card"><video controls preload="metadata" src="${m.url}"></video>
  <b>${esc(p?p.youtube_title:m.title)}</b><br><small>${Math.round(m.start)}s → ${Math.round(m.end)}s${m.score?` · score ${m.score}`:''} · ${esc(m.reason)}</small><br>
  <a href="${m.url}" download>Télécharger</a><div class="btns">${buttons}</div></div>`};
async function loadOld(){
  const ps=await (await fetch('/api/projects')).json();
  $('ph').hidden=!ps.length;
  $('old').innerHTML=ps.map(p=>`<h3>${p.title}</h3><div class="grid">${p.moments.map(card).join('')}</div>`).join('');
}
loadOld();
$('go').onclick=async()=>{
  $('go').disabled=true;$('out').innerHTML='';
  const r=await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    url:$('url').value,n:$('n').value,length:$('len').value,mode:$('mode').value,captions:$('cap').checked,hook:$('hook').checked,post:$('post').value})});
  const {id}=await r.json();
  const t=setInterval(async()=>{
    const j=await (await fetch('/api/job/'+id)).json();
    $('st').textContent=j.error?('Erreur : '+j.error):j.status||'';
    if(!j.done)return;clearInterval(t);$('go').disabled=false;
    $('out').innerHTML=(j.moments||[]).map(card).join('');loadOld();
  },1500);
};
</script></body></html>
