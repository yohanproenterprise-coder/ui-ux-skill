<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0d10">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jarvis</title>
<style>
:root { --bg: #0c0d10; --surface: #15161a; --text: #ececf1; --muted: #9b9ca6; --line: rgba(255,255,255,.13);
        --accent: #8b90ff; --accent-strong: #5b61f0; --accent-soft: rgba(139,144,255,.16); --err: #f87171; color-scheme: dark; }
@media (prefers-color-scheme: light) {
  :root { --bg: #f6f6f8; --surface: #ffffff; --text: #17171c; --muted: #5f6070; --line: rgba(15,15,30,.15);
          --accent: #4f46e5; --accent-strong: #4f46e5; --accent-soft: rgba(79,70,229,.1); --err: #dc2626; color-scheme: light; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--text); padding: 16px; background: var(--bg);
       font: 16px/1.5 Inter, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
form { width: 100%; max-width: 340px; text-align: center; padding: 32px 24px; border-radius: 20px;
       background: var(--surface); border: 1px solid var(--line); box-shadow: 0 8px 32px rgba(0,0,0,.2); }
.reactor { width: 52px; height: 52px; margin: 0 auto 18px; border-radius: 50%;
           background: radial-gradient(circle at 35% 30%, #c7c9ff, var(--accent-strong) 70%); }
.reactor i { display: none; }
h1 { margin: 0 0 4px; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
input { width: 100%; font: inherit; font-size: 26px; letter-spacing: 10px; text-align: center; padding: 10px; min-height: 52px;
        border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); outline: none; }
input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
button { width: 100%; margin-top: 14px; padding: 13px; min-height: 48px; font: inherit; font-weight: 600; border: 0; border-radius: 12px;
         background: var(--accent-strong); color: #fff; cursor: pointer; }
button:hover { filter: brightness(1.08); }
#err { color: var(--err); min-height: 1.5em; margin: 12px 0 0; font-size: 14px; }
</style>
</head>
<body>
<form id="f">
  <div class="reactor"><i></i><i></i></div>
  <h1>Jarvis</h1>
  <p>Entre le code PIN choisi dans les réglages de Jarvis sur ton PC.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••" autofocus>
  <button>Se connecter</button>
  <div id="err" role="alert"></div>
</form>
<script>
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const r = await fetch("/login", {method: "POST", headers: {"Content-Type": "application/json"},
                                   body: JSON.stringify({pin: document.getElementById("pin").value})});
  const d = await r.json();
  if (d.ok) location.reload();
  else { document.getElementById("err").textContent = d.error; document.getElementById("pin").value = ""; }
};
</script>
</body>
</html>
