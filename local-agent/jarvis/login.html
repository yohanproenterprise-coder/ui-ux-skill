<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05080f">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jarvis</title>
<style>
:root { --bg: #05080f; --text: #e8f3ff; --muted: #8196b0; --cyan: #3ddcff; --blue: #1a8cff; --err: #ff6b7a;
        --line: rgba(120,200,255,.28); --glow: rgba(61,220,255,.35); }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--text); padding: 16px;
       font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
       background: radial-gradient(900px 500px at 50% -10%, rgba(26,140,255,.22), transparent 60%), var(--bg); }
form { width: 100%; max-width: 340px; text-align: center; padding: 30px 22px; border-radius: 22px;
       background: rgba(13,22,38,.7); border: 1px solid var(--line); backdrop-filter: blur(14px); }
.reactor { width: 84px; height: 84px; margin: 0 auto 18px; position: relative; border-radius: 50%;
  background: radial-gradient(circle, #fff 0 9%, var(--cyan) 14%, rgba(61,220,255,.25) 32%, transparent 62%); box-shadow: 0 0 40px var(--glow); }
.reactor i { position: absolute; inset: 0; border-radius: 50%; border: 4px solid transparent; }
.reactor i:nth-child(1) { border-top-color: var(--cyan); border-bottom-color: var(--cyan); animation: spin 6s linear infinite; }
.reactor i:nth-child(2) { inset: 16%; border-left-color: var(--blue); border-right-color: var(--blue); animation: spin 4s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .32em; text-shadow: 0 0 18px var(--glow); }
p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
input { width: 100%; font: inherit; font-size: 28px; letter-spacing: 10px; text-align: center; padding: 10px;
        border-radius: 14px; border: 1px solid var(--line); background: rgba(2,6,14,.6); color: var(--text); outline: none; }
input:focus { border-color: var(--cyan); box-shadow: 0 0 0 4px rgba(61,220,255,.1); }
button { width: 100%; margin-top: 14px; padding: 13px; font: inherit; font-weight: 600; border: 0; border-radius: 14px;
         background: linear-gradient(135deg, var(--blue), var(--cyan)); color: #031423; cursor: pointer; box-shadow: 0 0 20px rgba(61,220,255,.35); }
#err { color: var(--err); min-height: 1.5em; margin: 12px 0 0; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .reactor i { animation: none; } }
</style>
</head>
<body>
<form id="f">
  <div class="reactor"><i></i><i></i></div>
  <h1>JARVIS</h1>
  <p>Entre le code PIN choisi dans les réglages de Jarvis sur ton PC.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••" autofocus>
  <button>Se connecter</button>
  <div id="err" role="alert"></div>
</form>
<script>
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const r = await fetch("/login", {method: "POST", headers: {"Content-Type": "application/json"},
                                   body: JSON.stringify({pin: document.getElementById("pin").value})});
  const d = await r.json();
  if (d.ok) location.reload();
  else { document.getElementById("err").textContent = d.error; document.getElementById("pin").value = ""; }
};
</script>
</body>
</html>
