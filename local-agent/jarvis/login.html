<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jarvis</title>
<style>
:root { --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e6e8ee; --muted: #8b93a5;
        --accent: #6ea8fe; --accent-ink: #0b1220; --err: #f06a6a; }
@media (prefers-color-scheme: light) {
  :root { --bg: #f6f7f9; --panel: #fff; --border: #dde1e8; --text: #1b1f27; --muted: #5f6878;
          --accent: #2f6fdb; --accent-ink: #fff; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
       font: 16px/1.5 "Segoe UI", system-ui, sans-serif; padding: 16px; }
form { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
       padding: 28px 22px; text-align: center; }
img { width: 64px; height: 64px; }
h1 { margin: 10px 0 4px; font-size: 22px; }
p { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
input { width: 100%; font: inherit; font-size: 28px; letter-spacing: 10px; text-align: center; padding: 10px;
        border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
button { width: 100%; margin-top: 14px; padding: 12px; font: inherit; font-weight: 600; border: 0; border-radius: 12px;
         background: var(--accent); color: var(--accent-ink); cursor: pointer; }
#err { color: var(--err); min-height: 1.5em; margin: 10px 0 0; font-size: 14px; }
</style>
</head>
<body>
<form id="f">
  <img src="/icon-192.png" alt="">
  <h1>Jarvis</h1>
  <p>Entre le code PIN choisi dans les réglages de Jarvis sur ton PC.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••" autofocus>
  <button>Se connecter</button>
  <div id="err" role="alert"></div>
</form>
<script>
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const r = await fetch("/login", {method: "POST", headers: {"Content-Type": "application/json"},
                                   body: JSON.stringify({pin: document.getElementById("pin").value})});
  const d = await r.json();
  if (d.ok) location.reload();
  else { document.getElementById("err").textContent = d.error; document.getElementById("pin").value = ""; }
};
</script>
</body>
</html>
